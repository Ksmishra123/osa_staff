{% extends 'base.html' %}{% block content %}
<h1>Set a New Password</h1>
<form method="post" class="card" style="max-width:520px;">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>New password<br>
    <input type="password" name="new" required minlength="{{ min_length }}" autocomplete="new-password">
  </label>
  <label>Confirm new password<br>
    <input type="password" name="confirm" required minlength="{{ min_length }}" autocomplete="new-password">
  </label>
  <p class="hint">At least {{ min_length }} characters.</p>
  <button type="submit">Reset Password</button>
</form>
{% endblock %}
