{% extends 'base.html' %}{% block content %}
<h1>Forgot Password</h1>
<form method="post" class="card" style="max-width:520px;">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <p style="margin-top:0;">Enter the email address you use to log in and we'll email you a link to set a new password.</p>
  <label>Email<br><input type="email" name="email" required autofocus></label>
  <button type="submit">Send Reset Link</button>
  <a href="{{ url_for('login') }}" style="margin-left:8px;">Back to login</a>
</form>
{% endblock %}
